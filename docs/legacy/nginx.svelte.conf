server {
 listen 80;
 server_name _;
 client_max_body_size 12m;
 location /api/ {
   proxy_pass http://api:8080;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_buffering off;
   proxy_cache off;
   proxy_read_timeout 360s;
 }
 location / {
   proxy_pass http://web:3000;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
 }
}
