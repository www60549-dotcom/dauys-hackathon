name: Build and tests
on: [push, pull_request]
permissions:
 contents: read
jobs:
 frontend:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: 24, cache: npm}
   - run: npm ci --no-audit --no-fund
   - run: npm test
   - run: npm run build
 backend:
  runs-on: ubuntu-latest
  defaults:
   run: {working-directory: backend}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-go@v5
     with: {go-version: '1.25.x', cache-dependency-path: backend/go.sum}
   - run: go test ./...
   - run: go vet ./...
   - run: go build ./cmd/server
 containers:
  runs-on: ubuntu-latest
  timeout-minutes: 20
  env:
   POSTGRES_PASSWORD: ephemeral-ci-only
   DEMO_MODE: 'true'
   DEMO_PASSWORD: DauysDemo2026!
   COOKIE_SECURE: 'false'
   BASE_URL: http://127.0.0.1:8088
   DAUYS_ALLOW_TEST_WRITES: '1'
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: 24}
   - name: Build and start isolated Compose stack
     run: docker compose up -d --build --wait --wait-timeout 180
   - name: Health, fresh dataset and Nginx API flows
     run: |
      curl --fail --retry 15 --retry-delay 2 http://127.0.0.1:8088/api/health
      node tests/api/fresh.mjs
      node tests/api/dataset.mjs
      node tests/api/smoke.mjs
      node tests/api/features.mjs
      node tests/api/dashboard.mjs
   - name: Build and check combined Render image
     run: |
      docker build -t dauys-render-ci .
      docker run -d --name dauys-render-ci --network dauys_default -p 127.0.0.1:8089:8080 \
        -e 'DATABASE_URL=postgres://dauys:ephemeral-ci-only@db:5432/dauys?sslmode=disable' \
        -e DEMO_MODE=false -e COOKIE_SECURE=false dauys-render-ci
      curl --fail --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:8089/api/health
      curl --fail http://127.0.0.1:8089/deep/link | grep 'id="root"'
      docker stop dauys-render-ci
   - name: Paired database and upload backup
     shell: pwsh
     run: ./scripts/backup-compose.ps1 -Destination ./data/ci-backup
   - name: Restore backup into a separate database and file directory
     run: |
      docker compose cp data/ci-backup/database.dump db:/tmp/restore-ci.dump
      docker compose exec -T db createdb -U dauys dauys_restore_ci
      docker compose exec -T db pg_restore -U dauys -d dauys_restore_ci --no-owner /tmp/restore-ci.dump
      original=$(docker compose exec -T db psql -U dauys -d dauys -At -c 'SELECT count(*) FROM appeals')
      restored=$(docker compose exec -T db psql -U dauys -d dauys_restore_ci -At -c 'SELECT count(*) FROM appeals')
      test "$original" = "$restored"
      mkdir -p data/restored-files
      tar -xzf data/ci-backup/uploads.tar.gz -C data/restored-files
      docker compose exec -T api sh -c 'cd /data/uploads && find . -type f -exec sha256sum {} \;' | sort > data/uploads-before.txt
      (cd data/restored-files/uploads && find . -type f -exec sha256sum {} \;) | sort > data/uploads-after.txt
      test -s data/uploads-before.txt
      diff data/uploads-before.txt data/uploads-after.txt
      curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://127.0.0.1:8088/api/health
   - name: Collect container logs
     if: always()
     run: |
      mkdir -p data
      docker compose logs --no-color > data/ci-docker.log
   - uses: actions/upload-artifact@v4
     if: failure()
     with: {name: container-diagnostics, path: data/ci-docker.log}
   - name: Remove only this runner's test containers and volumes
     if: always()
     run: |
      docker rm -f dauys-render-ci || true
      docker compose down --volumes
