name: dauys
services:
 db:
  image: postgres:17-alpine
  environment:
   POSTGRES_DB: dauys
   POSTGRES_USER: dauys
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  volumes: ["postgres:/var/lib/postgresql/data"]
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U dauys -d dauys"]
   interval: 5s
   timeout: 3s
   retries: 20
  restart: unless-stopped
 api:
  build: ./backend
  environment:
   DATABASE_URL: postgres://dauys:${POSTGRES_PASSWORD}@db:5432/dauys?sslmode=disable
   DEMO_MODE: ${DEMO_MODE:-false}
   DEMO_PASSWORD: ${DEMO_PASSWORD:-}
   COOKIE_SECURE: ${COOKIE_SECURE:-false}
   APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
   HOST: 0.0.0.0
   PORT: 8080
   UPLOAD_DIR: /data/uploads
  volumes: ["uploads:/data/uploads"]
  depends_on:
   db: {condition: service_healthy}
  healthcheck:
   test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
   interval: 10s
   timeout: 5s
   retries: 10
  restart: unless-stopped
 web:
  build:
   context: .
   dockerfile: deploy/Dockerfile.web
  ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:8080"]
  depends_on:
   api: {condition: service_healthy}
  restart: unless-stopped
volumes:
 postgres:
 uploads:
